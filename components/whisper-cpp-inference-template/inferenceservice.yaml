---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: ${MODEL_KEY}
  namespace: ai
spec:
  predictor:
    minReplicas: 1
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    model:
      modelFormat:
        name: whisper
        version: "1"
      runtime: whisper-cpp-rocm
      storageUri: pvc://ai-model-cache/${MODEL_KEY}/
      resources:
        requests:
          cpu: 500m
          memory: 3Gi
          amd.com/gpu: "1"
          amd.com/gpumem: "2048"
          amd.com/gpucores: "20"
        limits:
          cpu: "2"
          memory: 6Gi
          amd.com/gpu: "1"
          amd.com/gpumem: "2048"
          amd.com/gpucores: "20"
