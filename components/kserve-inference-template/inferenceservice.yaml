---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: ${MODEL_KEY}
  namespace: ai
spec:
  predictor:
    minReplicas: 1
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    model:
      modelFormat:
        name: vllm
        version: "1"
      args:
        - --served-model-name=${SERVED_MODEL_NAME}
        - --max-model-len=${MAX_MODEL_LEN}
        - --gpu-memory-utilization=${GPU_MEMORY_UTILIZATION}
      runtime: vllm-rocm
      storageUri: pvc://ai-model-cache/${MODEL_KEY}/
      resources:
        requests:
          cpu: "${CPU_REQUEST}"
          memory: "${MEMORY_REQUEST}"
          amd.com/gpu: "1"
          amd.com/gpumem: "${GPU_MEMORY_MIB}"
          amd.com/gpucores: "${GPU_CORES_PERCENT}"
        limits:
          cpu: "${CPU_LIMIT}"
          memory: "${MEMORY_LIMIT}"
          amd.com/gpu: "1"
          amd.com/gpumem: "${GPU_MEMORY_MIB}"
          amd.com/gpucores: "${GPU_CORES_PERCENT}"
