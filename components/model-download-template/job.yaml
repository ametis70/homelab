---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${DOWNLOAD_JOB_NAME}
  namespace: ai
  labels:
    app.kubernetes.io/name: model-download
    app.kubernetes.io/instance: ${MODEL_KEY}
spec:
  activeDeadlineSeconds: 3600
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-download
        app.kubernetes.io/instance: ${MODEL_KEY}
    spec:
      restartPolicy: Never
      nodeSelector:
        dedicated: ai
      tolerations:
        - key: dedicated
          operator: Equal
          value: ai
          effect: NoSchedule
      containers:
        - name: download
          image: kserve/storage-initializer:v0.21.0
          imagePullPolicy: IfNotPresent
          args:
            - ${MODEL_URI}
            - /models/${MODEL_KEY}
          env:
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            - name: HF_HUB_DISABLE_XET
              value: "1"
            - name: STORAGE_ALLOW_PATTERNS
              value: "${DOWNLOAD_ALLOW_PATTERNS}"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface-token
                  key: HF_TOKEN
                  optional: true
          resources:
            requests:
              cpu: "${DOWNLOAD_CPU_REQUEST}"
              memory: "${DOWNLOAD_MEMORY_REQUEST}"
            limits:
              cpu: "${DOWNLOAD_CPU_LIMIT}"
              memory: "${DOWNLOAD_MEMORY_LIMIT}"
          volumeMounts:
            - name: model-cache
              mountPath: /models
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: ai-model-cache
