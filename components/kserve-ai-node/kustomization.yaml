---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: serving.kserve.io
      version: v1beta1
      kind: InferenceService
    patch: |-
      - op: add
        path: /spec/predictor/nodeSelector
        value:
          dedicated: ai
      - op: add
        path: /spec/predictor/tolerations
        value:
          - key: dedicated
            operator: Equal
            value: ai
            effect: NoSchedule
