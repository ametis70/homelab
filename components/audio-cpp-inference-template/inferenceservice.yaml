---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: ${INFERENCE_SERVICE_NAME}
  namespace: ai
spec:
  predictor:
    minReplicas: 1
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    initContainers:
      - name: download-audio-model
        image: rocm/pytorch:rocm7.2.3_ubuntu24.04_py3.12_pytorch_release_2.9.1
        imagePullPolicy: IfNotPresent
        command:
          - python3
          - /opt/audio-cpp/download-model.py
        env:
          - name: AUDIOCPP_MODEL_FILE
            value: ${AUDIOCPP_MODEL_FILE}
          - name: AUDIOCPP_MODEL_URL
            value: ${AUDIOCPP_MODEL_URL}
          - name: AUDIOCPP_MODEL_SHA256
            value: ${AUDIOCPP_MODEL_SHA256}
          - name: HF_TOKEN
            valueFrom:
              secretKeyRef:
                name: huggingface-token
                key: HF_TOKEN
                optional: true
        resources:
          requests:
            cpu: "${DOWNLOAD_CPU_REQUEST}"
            memory: "${DOWNLOAD_MEMORY_REQUEST}"
          limits:
            cpu: "${DOWNLOAD_CPU_LIMIT}"
            memory: "${DOWNLOAD_MEMORY_LIMIT}"
        volumeMounts:
          - name: audio-cpp-model-cache
            mountPath: /mnt/models
          - name: audio-cpp-runtime-config
            mountPath: /opt/audio-cpp
            readOnly: true
    model:
      modelFormat:
        name: audio-cpp
        version: "1"
      runtime: audio-cpp-rocm
      env:
        - name: AUDIOCPP_MODEL_ID
          value: ${AUDIOCPP_MODEL_ID}
        - name: AUDIOCPP_MODEL_FAMILY
          value: ${AUDIOCPP_MODEL_FAMILY}
        - name: AUDIOCPP_MODEL_TASK
          value: ${AUDIOCPP_MODEL_TASK}
        - name: AUDIOCPP_MODEL_FILE
          value: ${AUDIOCPP_MODEL_FILE}
        - name: AUDIOCPP_DEFAULT_VOICE
          value: "${AUDIOCPP_DEFAULT_VOICE}"
      resources:
        requests:
          cpu: "${CPU_REQUEST}"
          memory: "${MEMORY_REQUEST}"
          amd.com/gpu: "1"
          amd.com/gpumem: "${GPU_MEMORY_MIB}"
          amd.com/gpucores: "${GPU_CORES_PERCENT}"
        limits:
          cpu: "${CPU_LIMIT}"
          memory: "${MEMORY_LIMIT}"
          amd.com/gpu: "1"
          amd.com/gpumem: "${GPU_MEMORY_MIB}"
          amd.com/gpucores: "${GPU_CORES_PERCENT}"
