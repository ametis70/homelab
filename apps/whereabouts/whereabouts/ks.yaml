---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: whereabouts
  namespace: whereabouts
spec:
  interval: 24h
  retryInterval: 2m
  timeout: 8m
  path: ./apps/whereabouts/whereabouts/resources
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
