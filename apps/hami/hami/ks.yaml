---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hami
spec:
  interval: 24h
  retryInterval: 2m
  timeout: 10m
  path: ./apps/hami/hami/resources
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: hami
  dependsOn:
    - name: helm-repositories
      namespace: flux-system
