---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hami
  namespace: hami
spec:
  interval: 24h
  chart:
    spec:
      chart: hami
      version: 2.10.0
      sourceRef:
        kind: HelmRepository
        name: hami-charts
        namespace: flux-system
  values:
    # The stock HAMi chart only deploys an NVIDIA device plugin. AMD devices
    # are registered by the separate HAMi AMD device-plugin chart below.
    devicePlugin:
      enabled: false
    devices:
      amd:
        enabled: true
        customresources:
          - amd.com/gpu
          - amd.com/gpumem
          - amd.com/gpucores
