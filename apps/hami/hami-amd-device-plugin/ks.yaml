---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hami-amd-device-plugin
spec:
  interval: 24h
  retryInterval: 2m
  timeout: 10m
  path: ./apps/hami/hami-amd-device-plugin/resources
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: hami
  dependsOn:
    - name: hami
      namespace: hami
