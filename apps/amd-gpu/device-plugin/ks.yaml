---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: amd-gpu-device-plugin
spec:
  interval: 24h
  retryInterval: 2m
  timeout: 5m
  path: ./apps/amd-gpu/device-plugin/resources
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: amd-gpu
