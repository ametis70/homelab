---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hami
  namespace: kube-system
spec:
  interval: 24h
  chart:
    spec:
      chart: hami
      version: 2.10.0
      sourceRef:
        kind: HelmRepository
        name: hami-charts
        namespace: flux-system
  values:
    # The stock HAMi chart only deploys an NVIDIA device plugin. AMD devices
    # are registered by the separate HAMi AMD device-plugin chart below.
    devicePlugin:
      enabled: false
    devices:
      amd:
        enabled: true
        customresources:
          - amd.com/gpu
          - amd.com/gpumem
          - amd.com/gpucores
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: amd-gpu
  namespace: kube-system
spec:
  interval: 24h
  chart:
    spec:
      chart: ./helm/amd-gpu
      sourceRef:
        kind: GitRepository
        name: hami-amd-device-plugin
        namespace: flux-system
  values:
    # Radeon/RDNA support is experimental in HAMi's AMD plugin. This device is gfx1200;
    # splitCount=5 enables five software vGPU slots, not hardware partitions.
    node_selector_enabled: true
    node_selector:
      dedicated: ai
    tolerations:
      - key: dedicated
        operator: Equal
        value: ai
        effect: NoSchedule
    dp:
      image:
        repository: ghcr.io/project-hami/amd-device-plugin
        tag: 0.0.3
      operatingMode: cu
      splitCount: 5
      reportNodeCapacity: true
      hookInstaller:
        enabled: true
      # The vGPU hook needs glibc >= 2.34; vLLM's Ubuntu 24.04 image satisfies this.
      muslFailClosed:
        enabled: false
