---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hami
  namespace: kube-system
spec:
  interval: 24h
  chart:
    spec:
      chart: hami
      version: 2.10.0
      sourceRef:
        kind: HelmRepository
        name: hami-charts
        namespace: flux-system
  values:
    # The stock HAMi chart only deploys an NVIDIA device plugin. AMD devices
    # are registered by the separate HAMi AMD device-plugin chart below.
    devicePlugin:
      enabled: false
    devices:
      amd:
        enabled: true
        customresources:
          - amd.com/gpu
          - amd.com/gpumem
          - amd.com/gpucores
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: amd-gpu
  namespace: kube-system
spec:
  interval: 24h
  chart:
    spec:
      chart: amd-gpu
      version: 0.0.3
      sourceRef:
        kind: HelmRepository
        name: hami-amd-device-plugin
        namespace: flux-system
  values:
    # gfx1200 uses five software vGPU slots, not hardware partitions.
    node_selector_enabled: true
    node_selector:
      dedicated: ai
    tolerations:
      - key: dedicated
        operator: Equal
        value: ai
        effect: NoSchedule
    dp:
      image:
        repository: ghcr.io/project-hami/amd-device-plugin
        tag: 0.0.3
      # Zero selects the upstream default (2 slots on gfx12); set 5 explicitly.
      splitCount: 5
      hookInstaller:
        enabled: true
      # The vGPU hook needs glibc >= 2.34; vLLM's Ubuntu 24.04 image satisfies this.
      muslFailClosed:
        enabled: false
