---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: amd-gpu-hami
spec:
  interval: 24h
  retryInterval: 2m
  timeout: 10m
  path: ./apps/amd-gpu/hami/resources
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: kube-system
  dependsOn:
    - name: amd-gpu-device-plugin
    - name: helm-repositories
      namespace: flux-system
