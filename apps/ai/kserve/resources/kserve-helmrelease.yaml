---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kserve
  namespace: ai
spec:
  interval: 24h
  dependsOn:
    - name: kserve-crd
  chartRef:
    kind: OCIRepository
    name: kserve-resources
  values:
    kserve:
      controller:
        deploymentMode: Standard
        nodeSelector:
          dedicated: ai
        tolerations:
          - key: dedicated
            operator: Equal
            value: ai
            effect: NoSchedule
        gateway:
          domain: ${DOMAIN}
          disableIngressCreation: false
          ingressGateway:
            enableGatewayApi: false
            createGateway: false
            className: traefik
