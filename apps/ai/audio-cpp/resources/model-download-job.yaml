---
apiVersion: batch/v1
kind: Job
metadata:
  name: audio-cpp-model-download
  namespace: ai
  labels:
    app.kubernetes.io/name: audio-cpp
    app.kubernetes.io/component: model-download
spec:
  activeDeadlineSeconds: 3600
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audio-cpp
        app.kubernetes.io/component: model-download
    spec:
      restartPolicy: Never
      nodeSelector:
        dedicated: ai
      tolerations:
        - key: dedicated
          operator: Equal
          value: ai
          effect: NoSchedule
      containers:
        - name: download
          image: rocm/pytorch:rocm7.2.3_ubuntu24.04_py3.12_pytorch_release_2.9.1
          imagePullPolicy: IfNotPresent
          command: ["python3", "-c"]
          args:
            - |
              import os
              import urllib.request
              from pathlib import Path

              revision = "874fcb41ececda20bcbc0782d6b4ea7f7d069ea8"
              repo = "https://huggingface.co/audio-cpp/audio.cpp-gguf/resolve/" + revision
              models = [
                  ("Kokoro-82M-GGUF/kokoro-82m-q8_0.gguf", "/models/audio-cpp/kokoro-82m-q8_0.gguf", 189550976),
                  ("Qwen3-ASR-0.6B-GGUF/qwen3-asr-0.6b-q8_0.gguf", "/models/audio-cpp/qwen3-asr-0.6b-q8_0.gguf", 1151279968),
              ]
              for relative_path, target_path, expected_size in models:
                  target = Path(target_path)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  if target.is_file() and target.stat().st_size == expected_size:
                      print(f"Already present: {target} ({expected_size} bytes)", flush=True)
                      continue
                  temporary = target.with_suffix(target.suffix + ".partial")
                  url = f"{repo}/{relative_path}?download=true"
                  print(f"Downloading {url} -> {temporary}", flush=True)
                  urllib.request.urlretrieve(url, temporary)
                  actual_size = temporary.stat().st_size
                  if actual_size != expected_size:
                      temporary.unlink(missing_ok=True)
                      raise SystemExit(f"Unexpected size for {target}: {actual_size} (expected {expected_size})")
                  os.replace(temporary, target)
                  print(f"Verified {target}: {actual_size} bytes", flush=True)
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: model-cache
              mountPath: /models
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: ai-model-cache
