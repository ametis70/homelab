---
apiVersion: serving.kserve.io/v1alpha1
kind: ClusterServingRuntime
metadata:
  name: whisper-cpp-rocm
  annotations:
    serving.kserve.io/server-type: whisper.cpp-rocm
spec:
  volumes:
    - name: whisper-rocm-bundle
      emptyDir:
        sizeLimit: 3Gi
  supportedModelFormats:
    - name: whisper
      version: "1"
      autoSelect: false
      priority: 1
  containers:
    - name: kserve-container
      # ROCm/PyTorch supplies the ROCm runtime library (including COMGR) that
      # the prebuilt Lemonade whisper.cpp bundle loads dynamically at startup.
      image: rocm/pytorch:rocm7.2.3_ubuntu24.04_py3.12_pytorch_release_2.9.1
      imagePullPolicy: IfNotPresent
      command:
        - /bin/bash
        - -ec
      args:
        - |
          bundle=/opt/whisper-rocm/whisper-v1.8.4-linux-rocm-gfx120X
          python3 - <<'PY'
          import hashlib
          import urllib.request
          from pathlib import Path

          url = "https://github.com/lemonade-sdk/whisper.cpp-rocm/releases/download/v1.8.4/whisper-v1.8.4-linux-rocm-gfx120X.tar.gz"
          archive = Path("/tmp/whisper-v1.8.4-linux-rocm-gfx120X.tar.gz")
          expected = "9d136701ceff188a6727ec7e80b005d77a464e1bc7dc4c2ea2815bebe3788290"
          digest = hashlib.sha256()
          with urllib.request.urlopen(url) as response, archive.open("wb") as target:
              while chunk := response.read(1024 * 1024):
                  target.write(chunk)
                  digest.update(chunk)
          if digest.hexdigest() != expected:
              raise SystemExit("ROCm whisper.cpp bundle checksum mismatch")
          print("ROCm whisper.cpp bundle checksum verified")
          PY
          tar --no-same-owner -xzf /tmp/whisper-v1.8.4-linux-rocm-gfx120X.tar.gz -C /opt/whisper-rocm
          rm -f /tmp/whisper-v1.8.4-linux-rocm-gfx120X.tar.gz
          if ! command -v ffmpeg >/dev/null 2>&1; then
            python3 -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --target /tmp/whisper-site imageio-ffmpeg==0.6.0
            ffmpeg_path=$(PYTHONPATH=/tmp/whisper-site python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
            mkdir -p /tmp/whisper-bin
            ln -s "$ffmpeg_path" /tmp/whisper-bin/ffmpeg
            export PATH="/tmp/whisper-bin:$PATH"
          fi
          export LD_LIBRARY_PATH="$bundle:/opt/rocm/lib:/opt/rocm/lib/llvm/lib:/opt/rocm/lib/rocm_sysdeps/lib:${LD_LIBRARY_PATH:-}"
          exec "$bundle/whisper-server" --model /mnt/models/ggml-large-v3-turbo.bin --host 0.0.0.0 --port 8080 --language auto --threads 4 --convert --inference-path /v1/audio/transcriptions
      volumeMounts:
        - name: whisper-rocm-bundle
          mountPath: /opt/whisper-rocm
      ports:
        - name: http1
          containerPort: 8080
          protocol: TCP
      readinessProbe:
        tcpSocket:
          port: 8080
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      startupProbe:
        tcpSocket:
          port: 8080
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 60
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        capabilities:
          drop:
            - ALL
