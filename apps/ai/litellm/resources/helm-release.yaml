apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  namespace: ai
  name: litellm
spec:
  interval: 24h
  chartRef:
    kind: OCIRepository
    name: litellm
  values:
    replicaCount: 1

    image:
      repository: ghcr.io/berriai/litellm
      tag: v1.106.1

    db:
      useExisting: true
      deployStandalone: false
      endpoint: "litellm-postgres-rw.ai.svc.cluster.local"
      port: 5432
      database: litellm
      secret:
        name: litellm-pg-secrets
        usernameKey: username
        passwordKey: password

    masterkeySecretName: litellm-secrets
    masterkeySecretKey: LITELLM_MASTER_KEY

    environmentSecrets:
      - litellm-secrets

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 2Gi

    proxy_config:
      model_list: []
      router_settings:
        enable_cost: true
        num_retries: 0
        timeout: 600

    livenessProbe:
      enabled: true
      httpGet:
        path: /health/liveliness
        port: 4000
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 5

    readinessProbe:
      enabled: true
      httpGet:
        path: /health/readiness
        port: 4000
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5

    service:
      type: ClusterIP
      port: 4000
      targetPort: 4000

    env:
      DISABLE_SCHEMA_UPDATE: "true"
      STORE_MODEL_IN_DB: "true"
