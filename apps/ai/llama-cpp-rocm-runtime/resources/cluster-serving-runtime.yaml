---
apiVersion: serving.kserve.io/v1alpha1
kind: ClusterServingRuntime
metadata:
  name: llama-cpp-rocm
  annotations:
    serving.kserve.io/server-type: llama.cpp-rocm
spec:
  supportedModelFormats:
    - name: gguf
      version: "1"
      autoSelect: false
      priority: 1
  containers:
    - name: kserve-container
      # Official llama.cpp ROCm server image, built with gfx1200 support.
      # Pin the image manifest; update deliberately after validating new builds.
      image: ghcr.io/ggml-org/llama.cpp:server-rocm@sha256:f30115a8d7aec88e2909db15492b28a262f2263fa511b1bd14f98768856baa47
      imagePullPolicy: IfNotPresent
      command:
        - /app/llama-server
      args:
        - --host
        - 0.0.0.0
        - --port
        - "8080"
        - --no-webui
        - --jinja
      ports:
        - name: http1
          containerPort: 8080
          protocol: TCP
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      startupProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 60
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        capabilities:
          drop:
            - ALL
