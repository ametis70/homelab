---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-cpp-model-download
  namespace: ai
data:
  download-model.py: |
    import hashlib
    import os
    import urllib.request
    from pathlib import Path

    relative_path = os.environ["MODEL_CACHE_FILE"]
    url = os.environ["MODEL_URL"]
    expected_sha256 = os.environ["MODEL_SHA256"].lower()
    target = Path("/model-cache") / relative_path
    target.parent.mkdir(parents=True, exist_ok=True)

    def matches(path):
        if not path.is_file():
            return False
        digest = hashlib.sha256()
        with path.open("rb") as model:
            while chunk := model.read(1024 * 1024):
                digest.update(chunk)
        return digest.hexdigest() == expected_sha256

    if matches(target):
        print(f"Model cache hit: {target}", flush=True)
        raise SystemExit(0)

    temporary = target.with_suffix(target.suffix + ".partial")
    headers = {"User-Agent": "homelab-llama-model-downloader"}
    token = os.environ.get("HF_TOKEN")
    if token:
        headers["Authorization"] = f"Bearer {token}"
    request = urllib.request.Request(url, headers=headers)
    digest = hashlib.sha256()
    print(f"Downloading {url} -> {temporary}", flush=True)
    with urllib.request.urlopen(request, timeout=1800) as source, temporary.open("wb") as output:
        while chunk := source.read(1024 * 1024):
            output.write(chunk)
            digest.update(chunk)
    actual_sha256 = digest.hexdigest()
    if actual_sha256 != expected_sha256:
        temporary.unlink(missing_ok=True)
        raise SystemExit(f"SHA-256 mismatch for {target}: {actual_sha256}")
    os.replace(temporary, target)
    print(f"Verified model file {target}", flush=True)
