---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: llama-cpp-rocm-runtime
spec:
  interval: 24h
  retryInterval: 2m
  timeout: 5m
  path: ./apps/ai/llama-cpp-rocm-runtime/resources
  prune: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: kserve
