---
apiVersion: serving.kserve.io/v1alpha1
kind: ClusterServingRuntime
metadata:
  name: audio-cpp-rocm
  annotations:
    serving.kserve.io/server-type: audio.cpp-rocm
spec:
  volumes:
    - name: audio-cpp-model-cache
      persistentVolumeClaim:
        claimName: ai-model-cache
    - name: audio-cpp-runtime-config
      configMap:
        name: audio-cpp-kserve-runtime
  supportedModelFormats:
    - name: audio-cpp
      version: "1"
      autoSelect: false
      priority: 1
  containers:
    - name: kserve-container
      image: rocm/pytorch:rocm7.2.3_ubuntu24.04_py3.12_pytorch_release_2.9.1
      imagePullPolicy: IfNotPresent
      command:
        - /bin/bash
        - /opt/audio-cpp/start-audiocpp.sh
      env:
        - name: LD_LIBRARY_PATH
          value: /opt/audio-cpp-runtime/espeak/usr/lib/x86_64-linux-gnu/pulseaudio:/opt/audio-cpp-runtime/espeak/usr/lib/x86_64-linux-gnu:/opt/rocm/lib
        - name: ESPEAK_DATA_PATH
          value: /opt/audio-cpp-runtime/espeak/usr/lib/x86_64-linux-gnu/espeak-ng-data
      volumeMounts:
        - name: audio-cpp-model-cache
          mountPath: /model-cache
          readOnly: true
        - name: audio-cpp-model-cache
          mountPath: /opt/audio-cpp-runtime
          # The model-download init container creates this checksum-keyed PVC subdirectory.
          subPath: runtime/audio-cpp/4d0688267b2b8c421238994031c720d52316cacc24150ea613ee6bb2e5b13dfc
        - name: audio-cpp-runtime-config
          mountPath: /opt/audio-cpp
          readOnly: true
      ports:
        - name: http1
          containerPort: 8080
          protocol: TCP
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      startupProbe:
        httpGet:
          path: /health
          port: 8080
        periodSeconds: 10
        timeoutSeconds: 10
        failureThreshold: 180
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        capabilities:
          drop:
            - ALL
