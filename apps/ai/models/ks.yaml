---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: models
spec:
  interval: 24h
  retryInterval: 2m
  timeout: 60m
  path: ./apps/ai/models/resources
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  dependsOn:
    - name: kserve
    - name: vllm-rocm-runtime
