      AUTOSCALER_CLASS: hpa
      SERVED_MODEL_NAME: qwen3.5-4b-q4_k_m
      CONTEXT_SIZE: '"16384"'
      KV_CACHE_TYPE_K: q4_0
      KV_CACHE_TYPE_V: q4_0
      DOWNLOAD_CPU_REQUEST: 250m
      DOWNLOAD_CPU_LIMIT: "2"
      DOWNLOAD_MEMORY_REQUEST: 512Mi
      DOWNLOAD_MEMORY_LIMIT: 2Gi
      CPU_REQUEST: 500m
      CPU_LIMIT: "2"
      MEMORY_REQUEST: 3Gi
      MEMORY_LIMIT: 6Gi
      GPU_MEMORY_MIB: "3272"
      GPU_CORES_PERCENT: "20"
