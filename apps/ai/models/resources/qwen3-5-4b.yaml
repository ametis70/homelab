---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: qwen3-5-4b
spec:
  interval: 24h
  retryInterval: 2m
  timeout: 60m
  path: ./components/llama-cpp-inference-template
  prune: true
  wait: true
  healthCheckExprs:
    - apiVersion: serving.kserve.io/v1beta1
      kind: InferenceService
      current: "status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')"
      failed: "status.conditions.exists(c, c.type == 'Ready' && c.status == 'False')"
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  dependsOn:
    - name: kserve
    - name: llama-cpp-rocm-runtime
    - name: amd-gpu-hami
      namespace: amd-gpu
  postBuild:
    substitute:
      INFERENCE_SERVICE_NAME: qwen3-5-4b-q4-k-m
      MODEL_CACHE_FILE: qwen3-5-4b-q4-k-m-e87f1764/Qwen3.5-4B-Q4_K_M.gguf
