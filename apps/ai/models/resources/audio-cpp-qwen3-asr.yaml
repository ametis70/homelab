---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: audio-cpp-qwen3-asr-model-download
spec:
  interval: 24h
  retryInterval: 2m
  timeout: 60m
  path: ./components/model-download-template
  prune: true
  force: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  dependsOn:
    - name: kserve
  postBuild:
    substitute:
      MODEL_KEY: audio-cpp-qwen3-asr-06b-q8-874fcb41
      MODEL_URI: hf://audio-cpp/audio.cpp-gguf:874fcb41ececda20bcbc0782d6b4ea7f7d069ea8
      DOWNLOAD_ALLOW_PATTERNS: Qwen3-ASR-0.6B-GGUF/qwen3-asr-0.6b-q8_0.gguf
      DOWNLOAD_JOB_NAME: audio-cpp-qwen3-asr-06b-q8-download-v1
      DOWNLOAD_CPU_REQUEST: 250m
      DOWNLOAD_CPU_LIMIT: "2"
      DOWNLOAD_MEMORY_REQUEST: 512Mi
      DOWNLOAD_MEMORY_LIMIT: 2Gi
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: audio-cpp-qwen3-asr
spec:
  interval: 24h
  retryInterval: 2m
  timeout: 60m
  path: ./components/audio-cpp-inference-template
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  dependsOn:
    - name: kserve
    - name: audio-cpp-qwen3-asr-model-download
    - name: audio-cpp
    - name: audio-cpp-rocm-runtime
    - name: amd-gpu-hami
      namespace: amd-gpu
  postBuild:
    substitute:
      MODEL_KEY: audio-cpp-qwen3-asr-06b-q8-874fcb41
      INFERENCE_SERVICE_NAME: audio-cpp-qwen3-asr
      AUDIOCPP_MODEL_ID: qwen3-asr
      AUDIOCPP_MODEL_FAMILY: qwen3_asr
      AUDIOCPP_MODEL_TASK: asr
      AUDIOCPP_MODEL_FILE: Qwen3-ASR-0.6B-GGUF/qwen3-asr-0.6b-q8_0.gguf
      AUDIOCPP_DEFAULT_VOICE: none
      CPU_REQUEST: "1"
      CPU_LIMIT: "3"
      MEMORY_REQUEST: 3Gi
      MEMORY_LIMIT: 6Gi
      GPU_MEMORY_MIB: "3072"
      GPU_CORES_PERCENT: "35"
