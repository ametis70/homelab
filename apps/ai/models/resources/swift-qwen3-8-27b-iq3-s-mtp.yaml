      MIN_REPLICAS: "0"
      AUTOSCALER_CLASS: none
      SERVED_MODEL_NAME: swift-1.5-qwen3.8-27b-iq3_s-mtp
      CONTEXT_SIZE: '"131072"'
      KV_CACHE_TYPE_K: q4_0
      KV_CACHE_TYPE_V: q4_0
      DOWNLOAD_CPU_REQUEST: 250m
      DOWNLOAD_CPU_LIMIT: "2"
      DOWNLOAD_MEMORY_REQUEST: 512Mi
      DOWNLOAD_MEMORY_LIMIT: 2Gi
      CPU_REQUEST: "2"
      CPU_LIMIT: "4"
      MEMORY_REQUEST: 8Gi
      MEMORY_LIMIT: 12Gi
      GPU_MEMORY_MIB: "16304"
      GPU_CORES_PERCENT: "100"
