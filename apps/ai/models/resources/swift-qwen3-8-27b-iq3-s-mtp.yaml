---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: swift-qwen3-8-27b-iq3-s-mtp
spec:
  interval: 24h
  retryInterval: 2m
  timeout: 60m
  path: ./components/llama-cpp-mtp-inference-template
  prune: true
  wait: true
  healthCheckExprs:
    - apiVersion: serving.kserve.io/v1beta1
      kind: InferenceService
      current: "status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')"
      failed: "status.conditions.exists(c, c.type == 'Ready' && c.status == 'False')"
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  dependsOn:
    - name: kserve
    - name: llama-cpp-rocm-runtime
    - name: hami-amd-device-plugin
      namespace: hami
  postBuild:
    substitute:
      INFERENCE_SERVICE_NAME: swift-qwen3-8-27b-iq3-s-mtp
      MODEL_CACHE_FILE: swift-qwen3-8-27b-iq3-s-mtp-9aecf1cd/Swift-1.5-Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf
      MODEL_URL: https://huggingface.co/ukisai/Swift-1.5-Qwen3.8-27B-GSQ-RCO-GGUF/resolve/main/Swift-1.5-Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf?download=true
