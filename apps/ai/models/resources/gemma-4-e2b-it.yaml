---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gemma-4-e2b-it-model-download
spec:
  interval: 24h
  retryInterval: 2m
  timeout: 60m
  path: ./components/model-download-template
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  dependsOn:
    - name: kserve
  postBuild:
    substitute:
      MODEL_KEY: gemma-4-e2b-it-qat-q4-0-675cff42
      MODEL_URI: https://huggingface.co/google/gemma-4-E2B-it-qat-q4_0-gguf/resolve/675cff42a74c774d6cb76f76d8eacb49b48c9b93/gemma-4-E2B_q4_0-it.gguf
      DOWNLOAD_JOB_NAME: gemma-4-e2b-it-qat-q4-0-download-v2
      DOWNLOAD_CPU_REQUEST: 500m
      DOWNLOAD_CPU_LIMIT: "2"
      DOWNLOAD_MEMORY_REQUEST: 512Mi
      DOWNLOAD_MEMORY_LIMIT: 2Gi
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gemma-4-e2b-it
spec:
  interval: 24h
  retryInterval: 2m
  timeout: 60m
  path: ./components/llama-cpp-inference-template
  prune: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  dependsOn:
    - name: kserve
    - name: gemma-4-e2b-it-model-download
    - name: llama-cpp-rocm-runtime
    - name: amd-gpu-hami
      namespace: amd-gpu
  postBuild:
    substitute:
      MODEL_KEY: gemma-4-e2b-it-qat-q4-0-675cff42
      MODEL_FILE: gemma-4-E2B_q4_0-it.gguf
      SERVED_MODEL_NAME: gemma-4-e2b-it-q4_0
      CONTEXT_SIZE: '"2048"'
      CPU_REQUEST: 500m
      CPU_LIMIT: "2"
      MEMORY_REQUEST: 3Gi
      MEMORY_LIMIT: 6Gi
      GPU_MEMORY_MIB: "8192"
      GPU_CORES_PERCENT: "50"
