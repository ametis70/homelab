---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: qwen3-5-08b-model-download
spec:
  interval: 24h
  retryInterval: 2m
  timeout: 60m
  path: ./components/model-download-template
  prune: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  dependsOn:
    - name: kserve
  postBuild:
    substitute:
      MODEL_KEY: qwen3-5-08b-2fc06364
      HF_MODEL_URI: hf://Qwen/Qwen3.5-0.8B:2fc06364715b967f1860aea9cf38778875588b17
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: qwen3-5-08b
spec:
  interval: 24h
  retryInterval: 2m
  timeout: 60m
  path: ./components/kserve-inference-template
  prune: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  dependsOn:
    - name: kserve
    - name: qwen3-5-08b-model-download
    - name: vllm-rocm-runtime
    - name: amd-gpu-hami
      namespace: amd-gpu
  postBuild:
    substitute:
      MODEL_KEY: qwen3-5-08b-2fc06364
      SERVED_MODEL_NAME: qwen-3.5-0.8b
      MAX_MODEL_LEN: "4096"
      GPU_MEMORY_UTILIZATION: "0.9"
      CPU_REQUEST: 500m
      CPU_LIMIT: "2"
      MEMORY_REQUEST: 6Gi
      MEMORY_LIMIT: 10Gi
      GPU_MEMORY_MIB: "2048"
      GPU_CORES_PERCENT: "10"
