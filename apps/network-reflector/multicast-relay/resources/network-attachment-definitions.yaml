---
# Private network (VLAN 10)
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: private-vlan10
  namespace: network-reflector
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "macvlan",
      "master": "vlan10",
      "mode": "bridge",
      "ipam": {
        "type": "whereabouts",
        "datastore": "kubernetes",
        "kubernetes": {
          "kubeconfig": "/etc/cni/net.d/whereabouts.d/whereabouts.kubeconfig"
        },
        "range": "10.0.10.0/24",
        "range_start": "10.0.10.11",
        "range_end": "10.0.10.11",
        "enable_overlapping_ranges": true,
        "log_file": "/var/log/whereabouts.log",
        "log_level": "info",
        "routes": [
          { "dst": "224.0.0.0/4" },
          { "dst": "239.0.0.0/8" }
        ]
      }
    }
