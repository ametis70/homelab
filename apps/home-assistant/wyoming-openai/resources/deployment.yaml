---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wyoming-openai
  namespace: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wyoming-openai
  template:
    metadata:
      labels:
        app: wyoming-openai
    spec:
      containers:
        - name: wyoming-openai
          image: ghcr.io/roryeckel/wyoming_openai:0.8.0
          imagePullPolicy: IfNotPresent
          env:
            - name: WYOMING_URI
              value: tcp://0.0.0.0:10300
            - name: WYOMING_LOG_LEVEL
              value: INFO
            - name: WYOMING_LANGUAGES
              value: en
            - name: STT_OPENAI_URL
              value: http://whisper-large-v3-turbo-5359861c-predictor.ai.svc.cluster.local/v1
            - name: STT_MODELS
              value: whisper-1
            - name: STT_BACKEND
              value: OPENAI
          ports:
            - containerPort: 10300
              name: wyoming
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 10300
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 10300
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
