---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wyoming-openai
  namespace: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wyoming-openai
  template:
    metadata:
      labels:
        app: wyoming-openai
    spec:
      containers:
        - name: wyoming-openai
          image: ghcr.io/roryeckel/wyoming_openai:0.8.0
          imagePullPolicy: IfNotPresent
          env:
            - name: WYOMING_URI
              value: tcp://0.0.0.0:10300
            - name: WYOMING_LOG_LEVEL
              value: INFO
            - name: WYOMING_LANGUAGES
              value: en es
            - name: STT_OPENAI_URL
              value: http://audio-cpp-qwen3-asr-predictor.ai.svc.cluster.local/v1
            - name: STT_MODELS
              value: qwen3-asr
            - name: STT_BACKEND
              value: OPENAI
            - name: TTS_OPENAI_URL
              value: http://audio-cpp-kokoro-tts-predictor.ai.svc.cluster.local/v1
            - name: TTS_MODELS
              value: kokoro-tts
            - name: TTS_BACKEND
              value: OPENAI
            - name: TTS_VOICES
              value: af_heart ef_dora
          ports:
            - containerPort: 10300
              name: wyoming
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 10300
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 10300
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
