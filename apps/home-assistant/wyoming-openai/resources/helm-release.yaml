---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  namespace: home-assistant
  name: wyoming-openai
spec:
  interval: 24h0m0s
  chart:
    spec:
      chart: app-template
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      version: 5.0.1
  values:
    controllers:
      wyoming-openai:
        containers:
          app:
            image:
              repository: ghcr.io/roryeckel/wyoming_openai
              tag: 0.8.0
            env:
              WYOMING_URI: tcp://0.0.0.0:10300
              WYOMING_LOG_LEVEL: INFO
              WYOMING_LANGUAGES: "en es"
              STT_OPENAI_URL: http://whisper-large-v3-turbo-5359861c-predictor.ai.svc.cluster.local/v1
              STT_MODELS: whisper-1
              STT_BACKEND: OPENAI
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 10300
                  initialDelaySeconds: 20
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
    service:
      app:
        controller: wyoming-openai
        ports:
          wyoming:
            port: *port
